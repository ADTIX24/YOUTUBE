<!doctype html>
<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : null;
          let currentFetch = originalFetch;

          // Define own property on window to allow reassignment in strict mode
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });

          // Also ensure Window.prototype has a setter if descriptor is getter-only
          if (typeof Window !== 'undefined' && Window.prototype) {
            const desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (desc && !desc.set && desc.configurable) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get() {
                  return currentFetch;
                },
                set(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // Non-blocking fallback
        }
      })();
    </script>
